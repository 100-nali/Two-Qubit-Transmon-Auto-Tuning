[tool.poetry]
name = "two-qubit-transmon-auto-tuning"
version = "0.1.0"
description = "Simulation and Bayesian auto-tuning of high-fidelity two-qubit superconducting-transmon gates."
authors = [
    "Sonali Goel <107930544+100-nali@users.noreply.github.com>",
    "Joel Pendleton <joelkieronpendleton@gmail.com>",
]
readme = "README.md"
license = "MIT"
repository = "https://github.com/100-nali/Two-Qubit-Transmon-Auto-Tuning"
packages = [{include = "two_qubit_transmon_auto_tuning"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
qutip = "^4.7.3"
numpy = "^1.26.1"
# matplotlib is capped below 3.8 because QuTiP 4.7's 3D tomography plots
# (qpt_plot_combined) rely on Axes3D.w_xaxis, which was removed in matplotlib 3.8.
matplotlib = ">=3.7,<3.8"
pylint = "^3.0.2"
mypy = "^1.6.1"
black = "^23.10.1"
isort = "^5.12.0"
taskipy = "^1.12.0"
# scipy is capped below 1.13 because QuTiP 4.7.x imports scipy.special.sph_harm,
# which was removed in newer scipy releases.
scipy = ">=1.11.3,<1.13"
scikit-learn = "^1.3.2"
bayesian-optimization = "^1.4.3"


[tool.poetry.group.dev.dependencies]
pytest = "^7.4.2"
ipykernel = "^6.29.0"

[tool.poetry.scripts]
# Run the full auto-tuning pipeline: `poetry run tqtat-optimize`
tqtat-optimize = "two_qubit_transmon_auto_tuning.optimization:main"

[tool.taskipy.tasks]
lint = "pylint  ."
mypy = "mypy  ."
black = "black --exclude=.venv ." 
isort = "isort --atomic  . "
format = "task isort && task black"
all_tests = "pytest  ."

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ".*"
py_version=311

[tool.black]
line-length = 100
target-version = ['py311']

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: end-to-end tests that run a full optimization (deselect with '-m \"not slow\"')",
]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
